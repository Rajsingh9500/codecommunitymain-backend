name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 12 minutes (Render free tier sleeps after 15 mins of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping
        run: |
          curl -s -f https://codecommunitymain-backend.onrender.com/ || echo "Ping failed"
